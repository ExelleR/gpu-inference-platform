# Two small replicas time-slicing one L4 vs one replica: does sharing buy throughput or only latency?
name: timeslice
kind: platform
gpu_pool: l4-spot
accelerator: nvidia-l4
targets:
  - {name: single, url: http://vllm-single.bench.svc:8000, model: Qwen/Qwen3-1.7B, served_model: qwen3-1-7b}
  - {name: shared-x2, url: http://vllm-shared.bench.svc:8000, model: Qwen/Qwen3-1.7B, served_model: qwen3-1-7b}
loads:
  - {max_concurrency: 8, num_prompts: 200}
  - {max_concurrency: 32, num_prompts: 400}
