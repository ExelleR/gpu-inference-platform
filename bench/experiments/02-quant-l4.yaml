# Does quantization change latency and throughput on L4: bf16 vs FP8 vs AWQ for Qwen3-8B?
name: quant-l4
kind: engine
gpu_pool: l4-spot
accelerator: nvidia-l4
variants:
  - name: bf16
    model: Qwen/Qwen3-8B
    server_args: ["--max-model-len", "4096", "--gpu-memory-utilization", "0.92"]
  - name: fp8
    model: Qwen/Qwen3-8B-FP8
    server_args: ["--max-model-len", "8192", "--gpu-memory-utilization", "0.92"]
  - name: awq
    model: Qwen/Qwen3-8B-AWQ
    server_args: ["--max-model-len", "8192", "--gpu-memory-utilization", "0.92"]
loads:
  - {max_concurrency: 1, num_prompts: 50}
  - {max_concurrency: 4, num_prompts: 100}
  - {max_concurrency: 16, num_prompts: 200}
  - {max_concurrency: 64, num_prompts: 400}
