[project]
name = "gpubench"
version = "0.1.0"
description = "Benchmark orchestration and cost accounting for gpu-inference-platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14.1",
  "typer>=0.27.3",
  "pyyaml>=6.0",
  "matplotlib>=3.11.2",
]

[project.scripts]
gpubench = "gpubench.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpubench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
