apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: vllm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: vllm
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: kserve-predictors
spec:
  selector:
    matchLabels:
      component: predictor
  endpoints:
    - port: 8080
      path: /metrics
      interval: 15s
