# Single-replica, insecure (port-forward only) Argo CD for an ephemeral lab cluster.
redis-ha:
  enabled: false
controller:
  replicas: 1
server:
  replicas: 1
repoServer:
  replicas: 1
applicationSet:
  replicas: 1
dex:
  enabled: false
notifications:
  enabled: false
configs:
  params:
    server.insecure: true
  cm:
    # Argo CD stopped assessing Application health by default in 1.8; without this,
    # sync waves between child Applications do not wait for each other.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
