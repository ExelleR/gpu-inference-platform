repo:
  url: ""
  revision: main
destinationServer: https://kubernetes.default.svc
versions:
  certManager: v1.21.1
  keda: 2.20.2
  kserve: v0.20.0
  grafana: 13.2.1
# The serving tier (baseline vLLM Deployment + KServe InferenceService) keeps two L4 nodes
# running whenever the cluster is up; it is opt-in (make up SERVING=true).
serving:
  enabled: false

# The Managed Prometheus scrape config uses a GKE-only CRD; local clusters turn it off.
monitoring:
  enabled: true

# Managed Prometheus query frontend + Grafana with the vLLM dashboard; GKE only, opt-in
# (make up OBSERVABILITY=true). Also the Prometheus API that KEDA autoscaling queries.
observability:
  enabled: false
  projectId: ""
  gsaEmail: ""
