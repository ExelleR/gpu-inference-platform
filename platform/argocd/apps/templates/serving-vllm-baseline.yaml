{{- if .Values.serving.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serving-vllm-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: platform/serving/vllm-chart
    helm:
      releaseName: vllm-baseline
      valueFiles:
        - values-baseline-l4.yaml
  destination:
    server: {{ .Values.destinationServer }}
    namespace: inference
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
{{- end }}
