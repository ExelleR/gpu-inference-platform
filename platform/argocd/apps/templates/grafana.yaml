{{- if eq (toString .Values.observability.enabled) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: {{ .Values.versions.grafana | quote }}
      helm:
        releaseName: grafana
        valueFiles:
          - $values/platform/grafana/values.yaml
    - repoURL: {{ .Values.repo.url | quote }}
      targetRevision: {{ .Values.repo.revision | quote }}
      ref: values
  destination:
    server: {{ .Values.destinationServer }}
    namespace: observability
  syncPolicy:
    {{- include "apps.syncPolicy" . | nindent 4 }}
{{- end }}
