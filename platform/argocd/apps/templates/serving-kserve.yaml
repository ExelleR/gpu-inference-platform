{{- if .Values.serving.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serving-kserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: platform/serving/kserve
    directory:
      recurse: false
  destination:
    server: {{ .Values.destinationServer }}
    namespace: inference
  syncPolicy:
    {{- include "apps.syncPolicy" . | nindent 4 }}
{{- end }}
