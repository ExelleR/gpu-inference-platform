{{- if .Values.repo.token }}
apiVersion: v1
kind: Secret
metadata:
  name: platform-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: {{ .Values.repo.url | quote }}
  username: git
  password: {{ .Values.repo.token | quote }}
{{- end }}
