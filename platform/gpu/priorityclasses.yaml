apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: inference-critical
value: 100000
globalDefault: false
description: Serving workloads. May preempt benchmark jobs.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: bench-batch
value: 1000
preemptionPolicy: Never
globalDefault: false
description: Benchmark jobs. Never preempt anything.
