# "shared-x2" target of 06-timeslice: two Qwen3-1.7B replicas time-slicing one L4.
# Enable the l4-timeslice pool first (infra/terraform/gke/README.md), then:
# helm upgrade --install vllm-shared platform/serving/vllm-chart -n bench \
#   -f platform/serving/vllm-chart/values-timeslice-shared.yaml
replicas: 2
model:
  name: Qwen/Qwen3-1.7B
  servedName: qwen3-1-7b
args:
  - --max-model-len=4096
  - --gpu-memory-utilization=0.45
nodeSelector:
  pool: l4-timeslice
