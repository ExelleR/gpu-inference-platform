# For gated models only. Create with: kubectl -n inference create secret generic hf-secret --from-literal=HF_TOKEN=...
# then add to the predictor:
#   model:
#     env:
#       - name: HF_TOKEN
#         valueFrom:
#           secretKeyRef:
#             name: hf-secret
#             key: HF_TOKEN
apiVersion: v1
kind: Secret
metadata:
  name: hf-secret
  namespace: inference
type: Opaque
stringData:
  HF_TOKEN: replace-me
